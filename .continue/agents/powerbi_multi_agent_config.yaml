name: pbip-multi-agent
version: 1.0.0
schema: v1

models:
  - uses: gemma4-local

rules:
  # shared rules that apply to every agent in this workspace
  - file: 01-scope.md
  - file: 02-source-priority.md

# Define multiple agents as "assistants" that specialize via extra rules
assistants:
  - name: PBIP Architect
    model: gemma4-local
    rules:
      - file: 03-pbip-navigation.md
      - file: 05-analysis-format.md

  - name: DAX Specialist
    model: gemma4-local
    rules:
      - file: 03-pbip-navigation.md
      - file: 04-safe-editing.md
      - file: 06-documentation-maintenance.md
      # optionally a separate dax-style.md if you add it later

  - name: Doc Coach
    model: gemma4-local
    rules:
      - file: 06-documentation-maintenance.md
      - file: naming-standards.md  # if you move that into .continue/rules as a rule wrapper

  - name: Reviewer
    model: gemma4-local
    rules:
      - file: 05-analysis-format.md
      - file: 04-safe-editing.md